name: TEMP-Regen-Verification-Metadata

on:
  push:
    branches:
      - 'feature/19-python-tooling-cicd'

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: chmod +x gradlew
      - run: ./gradlew --write-verification-metadata sha256 --refresh-dependencies --no-daemon clean assembleDebug testDebugUnitTest detekt lintDebug koverXmlReportDebug
      - uses: actions/upload-artifact@v4
        with:
          name: verification-metadata-linux
          path: gradle/verification-metadata.xml
