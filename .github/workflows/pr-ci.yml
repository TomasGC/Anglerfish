name: PR-CI

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-checks:
    uses: TomasGC/Condor/.github/workflows/common-pr-ci.yml@v1
    with:
      # Code and tests live in three Gradle modules, not only app/.
      code-paths: '^(app|core|app-instrumented)/src/'
      test-paths: '^(app|core)/src/(test|integrationMock|integrationReal)/|^app-instrumented/src/'
