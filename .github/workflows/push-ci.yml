name: Push-CI

on:
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'

concurrency:
  group: push-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin-pipeline:
    uses: TomasGC/Condor/.github/workflows/kotlin-push-ci.yml@v1
    secrets: inherit
    with:
      app-name: anglerfish
      unit-tasks: '[":core:test", ":app:testDebugUnitTest"]'
      integration-mock-tasks: '[":core:integrationMock"]'
      integration-real-tasks: '[":core:integrationReal"]'
      app-environments: '["android"]'
      # #23: 90%, measured against testable code only -- see app/build.gradle.kts's koverReport
      # exclude list and contexts/design-patterns.md for what's deliberately left out and why.
      coverage-threshold: 90

  python-pipeline:
    uses: TomasGC/Condor/.github/workflows/python-push-ci.yml@v1
    with:
      skip-on-no-changes: true
