material = "1.13.0"
datastore = "1.1.1"
coroutines = "1.9.0"
junit = "4.13.2"
kover = "0.7.6"
detekt = "1.23.8"
dnsjava = "3.6.1"
androidxTestJunit = "1.2.1"
androidxTestRunner = "1.6.2"
androidxTestRules = "1.6.1"
