[pytest]
testpaths = tests
pythonpath = src
addopts = --strict-markers
markers =
    unit: pure logic, subprocess and AI mocked
    integration_mock: real filesystem, mocked subprocess and tools
    e2e: runs the scripts as subprocesses
    integration_real: real subprocess/tools, no mocks — requires a local Android SDK setup
    local_only: additionally requires a specific local resource (adb install, a configured AVD) not guaranteed on every machine
filterwarnings =
    error
